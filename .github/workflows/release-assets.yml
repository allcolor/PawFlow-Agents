name: Release Assets

on:
  push:
    tags: ['v*.*.*', '*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0.prealpha.1
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundled-pfps:
    name: Verify bundled PFPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify signatures and reproducible release artifacts
        env:
          PAWFLOW_PFP_SIGNING_KEY: ${{ secrets.PAWFLOW_PFP_SIGNING_KEY }}
        shell: bash
        run: |
          if [[ -n "$PAWFLOW_PFP_SIGNING_KEY" ]]; then
            python scripts/build-bundled-pfps.py \
              --check --key-env PAWFLOW_PFP_SIGNING_KEY
          else
            echo "::warning::PAWFLOW_PFP_SIGNING_KEY is not configured; signatures are verified but release artifacts cannot be rebuilt."
            python scripts/build-bundled-pfps.py --verify-only
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bundled-pfps
          path: data/repository/packages/bundled/pawflow.avatar*.pfp
          if-no-files-found: error

  install-zip:
    name: PawFlow install zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "VERSION=${raw#v}" >> "$GITHUB_ENV"

      - name: Build minimal install zip
        run: bash scripts/build-pawflow-install-zip.sh --version "$VERSION"

      - name: Build universal MCP client installers
        run: python scripts/build-mcp-client-installer.py --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: pawflow-install-zip
          path: dist/pawflow-installers/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-client-installers
          path: |
            dist/mcp-client-installers/*.zip
            dist/mcp-client-installers/*.tar.gz
          if-no-files-found: error

  pawcode:
    name: PawCode ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Resolve version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "VERSION=${raw#v}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build PawCode installers
        shell: bash
        run: python scripts/build-pawcode-installer.py --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: pawcode-${{ runner.os }}
          path: |
            dist/pawcode-installers/*.zip
            dist/pawcode-installers/*.tar.gz
            dist/pawcode-installers/*.deb
            dist/pawcode-installers/*setup.exe
          if-no-files-found: error

  relay-cli:
    name: Relay CLI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "VERSION=${raw#v}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build relay CLI installers
        shell: bash
        run: python scripts/build-relay-cli-installer.py --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: relay-cli-${{ runner.os }}
          path: |
            dist/relay-cli-installers/*.zip
            dist/relay-cli-installers/*.tar.gz
          if-no-files-found: error

  relay-desktop:
    name: Relay Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            npm_script: dist:linux
          - os: windows-latest
            npm_script: dist:win
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pawflow-relay-desktop/package-lock.json

      - name: Resolve version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          version="${raw#v}"
          desktop_version="$version"
          desktop_version="${desktop_version/.prealpha./-prealpha.}"
          desktop_version="${desktop_version/.alpha./-alpha.}"
          desktop_version="${desktop_version/.beta./-beta.}"
          desktop_version="${desktop_version/.rc./-rc.}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DESKTOP_VERSION=$desktop_version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r pawflow-relay-desktop/requirements-build.txt

      - name: Install desktop dependencies
        working-directory: pawflow-relay-desktop
        run: npm ci

      - name: Set desktop package version
        working-directory: pawflow-relay-desktop
        shell: bash
        run: npm version "$DESKTOP_VERSION" --no-git-tag-version --allow-same-version

      - name: Build Relay Desktop installers
        working-directory: pawflow-relay-desktop
        run: npm run ${{ matrix.npm_script }}

      - name: Smoke-test packaged Windows screen backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "pawflow-relay-desktop/runtime/bin/pawflow-relay.exe"
          $raw = '{}' | & $binary __pawflow_screen_action_child__ screen_status
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged relay screen_status exited with code $LASTEXITCODE"
          }
          $status = $raw | ConvertFrom-Json
          if ($status.error) {
            throw "Packaged relay screen backend is unhealthy: $($status.error)"
          }
          if ($status.mode -ne 'pawflow') {
            throw "Unexpected packaged relay screen mode: $($status.mode)"
          }
          $ptyRaw = & $binary __pawflow_winpty_check__
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged relay winpty check exited with code $LASTEXITCODE"
          }
          $ptyStatus = $ptyRaw | ConvertFrom-Json
          if (-not $ptyStatus.ok -or
              $ptyStatus.backend -ne 'PtyProcess' -or
              -not $ptyStatus.interactive) {
            throw "Packaged relay Windows terminal backend is unavailable"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: relay-desktop-${{ runner.os }}
          path: |
            dist/relay-desktop-installers/*.AppImage
            dist/relay-desktop-installers/*.deb
            dist/relay-desktop-installers/*.tar.gz
            dist/relay-desktop-installers/*.exe
            dist/relay-desktop-installers/*.zip
          if-no-files-found: error

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pawflow-vscode/package-lock.json

      - name: Resolve version
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          version="${raw#v}"
          extension_version="$version"
          extension_version="${extension_version/.prealpha./-prealpha.}"
          extension_version="${extension_version/.alpha./-alpha.}"
          extension_version="${extension_version/.beta./-beta.}"
          extension_version="${extension_version/.rc./-rc.}"
          echo "EXTENSION_VERSION=$extension_version" >> "$GITHUB_ENV"

      - name: Install extension dependencies
        working-directory: pawflow-vscode
        run: npm ci

      - name: Set extension package version
        working-directory: pawflow-vscode
        shell: bash
        run: npm version "$EXTENSION_VERSION" --no-git-tag-version --allow-same-version

      - name: Build VS Code extension package
        working-directory: pawflow-vscode
        shell: bash
        run: |
          npm run compile
          mkdir -p ../dist/vscode-installers
          node node_modules/@vscode/vsce/vsce package --out "../dist/vscode-installers/pawflow-vscode-${EXTENSION_VERSION}.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: dist/vscode-installers/*.vsix
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [bundled-pfps, install-zip, pawcode, relay-cli, relay-desktop, vscode-extension]
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ -n "${{ github.ref_name }}" && "${{ github.event_name }}" == "push" ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: release-assets/*
