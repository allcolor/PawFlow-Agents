// ── Queue Inspector drawer ──
function QueueDrawer({ instanceId, edgeData, source, target, onClose }) {
  const [stats, setStats] = useState(null);
  const [items, setItems] = useState([]);
  const [offset, setOffset] = useState(0);
  const [item, setItem] = useState(null);       // opened FlowFile
  const [notice, setNotice] = useState('');
  const LIMIT = 50;
  const cid = edgeData.connectionId;

  const load = useCallback((off) => {
    apiCall({ action: 'flow_runtime_queue_list', instance_id: instanceId,
              connection_id: cid, offset: off, limit: LIMIT })
      .then(d => {
        if (d.error) { setNotice(d.error); return; }
        setStats(d.stats); setItems(d.flowfiles || []); setOffset(off);
      })
      .catch(e => setNotice(String(e.message || e)));
  }, [instanceId, cid]);
  useEffect(() => { load(0); }, [load]);

  const control = (operation) => {
    if (operation === 'clear') {
      const n = stats?.queue_size || 0;
      const size = fmtBytes(stats?.queue_bytes || 0);
      if (!window.confirm(`Empty ${n} FlowFiles (${size})?\n\nThis operation cannot be undone.`)) return;
    }
    apiCall({ action: 'flow_runtime_queue_control', instance_id: instanceId,
              connection_id: cid, operation })
      .then(() => { setItem(null); load(0); });
  };
  const openItem = (pid) => {
    apiCall({ action: 'flow_runtime_queue_item', instance_id: instanceId,
              connection_id: cid, process_id: pid })
      .then(d => {
        // Queues are dynamic: consumed-between-list-and-click is normal.
        if (d.no_longer_queued) { setNotice('FlowFile is no longer queued.'); load(offset); return; }
        if (d.error) { setNotice(d.error); return; }
        setNotice(''); setItem(d);
      });
  };
  const dropItem = (pid) => {
    if (!window.confirm('Drop this FlowFile?\n\nThis operation cannot be undone.')) return;
    apiCall({ action: 'flow_runtime_flowfile_drop', instance_id: instanceId,
              connection_id: cid, process_id: pid })
      .then(() => { setItem(null); load(offset); });
  };
  const dlUrl = (pid) => `${API_BASE}/api/flow-runtime/${encodeURIComponent(instanceId)}`
    + `/queues/${encodeURIComponent(cid)}/flowfiles/${encodeURIComponent(pid)}/content`;

  const paused = !!stats?.paused;
  return jsxs('div', { className: 'rt-drawer', children: [
    jsxs('div', { className: 'rt-drawer-head', children: [
      jsxs('strong', { children: [source, ' \u2192 ', target] }),
      jsx('button', { className: 'rt-x', onClick: onClose, children: '\u2715' }),
    ] }),
    stats && jsxs(Fragment, { children: [
      jsxs('table', { className: 'rt-kv', children: [jsxs('tbody', { children: [
        jsxs('tr', { children: [jsx('td', { children: 'Relationship' }), jsx('td', { children: stats.relationship })] }),
        jsxs('tr', { children: [jsx('td', { children: 'State' }), jsx('td', { children: paused ? 'PAUSED' : (stats.backpressured ? 'BACKPRESSURE' : 'flowing') })] }),
        jsxs('tr', { children: [jsx('td', { children: 'FlowFiles' }), jsx('td', { children: String(stats.queue_size) })] }),
        jsxs('tr', { children: [jsx('td', { children: 'Size' }), jsx('td', { children: fmtBytes(stats.queue_bytes) })] }),
        jsxs('tr', { children: [jsx('td', { children: 'Max' }), jsxs('td', { children: [String(stats.max_queue_size), ' \u00B7 ', fmtBytes(stats.max_queue_bytes)] })] }),
        jsxs('tr', { children: [jsx('td', { children: 'TTL' }), jsx('td', { children: stats.ttl_seconds ? stats.ttl_seconds + 's' : 'disabled' })] }),
      ] })] }),
      jsxs('div', { className: 'rt-actions', children: [
        jsx('button', { onClick: () => control(paused ? 'resume' : 'pause'),
                        children: paused ? '\u25B6 Resume' : '\u23F8 Pause' }),
        jsx('button', { className: 'rt-danger', onClick: () => control('clear'),
                        children: '\uD83D\uDDD1 Empty queue' }),
        jsx('button', { onClick: () => load(offset), children: '\u21BB' }),
      ] }),
    ] }),
    notice && jsx('div', { className: 'rt-notice', children: notice }),
    item ? jsxs('div', { className: 'rt-item', children: [
      jsxs('div', { className: 'rt-actions', children: [
        jsx('button', { onClick: () => setItem(null), children: '\u2190 Queue' }),
        jsx('a', { href: dlUrl(item.flowfile.process_id), target: '_blank', rel: 'noreferrer',
                   children: jsx('button', { children: '\u2B07 Download' }) }),
        jsx('button', { className: 'rt-danger',
                        onClick: () => dropItem(item.flowfile.process_id),
                        children: '\uD83D\uDDD1 Drop' }),
      ] }),
      jsx('div', { className: 'rt-section', children: 'Attributes' }),
      jsx('table', { className: 'rt-kv', children: jsx('tbody', { children:
        Object.entries(item.attributes || {}).map(([k, v]) => jsxs('tr', {
          children: [jsx('td', { children: k }), jsx('td', { children: String(v) })],
        }, k)) }) }),
      jsx('div', { className: 'rt-section', children: 'Content' }),
      item.content?.available
        ? jsx('pre', { className: 'rt-content', children: item.content.text })
        : jsxs('div', { className: 'rt-notice', children: [
            fmtBytes(item.content?.size || 0), ' \u00B7 ',
            item.content?.mime_type || 'unknown type',
            jsx('br', {}), 'Preview unavailable (', item.content?.reason || '?', ')',
          ] }),
    ] })
    : jsxs(Fragment, { children: [
      jsx('table', { className: 'rt-list', children: jsxs('tbody', { children: [
        jsxs('tr', { className: 'rt-list-head', children: [
          jsx('td', { children: 'UUID' }), jsx('td', { children: 'Size' }),
          jsx('td', { children: 'Attrs' }),
        ] }),
        ...items.map(f => jsxs('tr', { className: 'rt-row',
          onClick: () => openItem(f.process_id),
          children: [
            jsx('td', { children: f.process_id.slice(0, 8) + '\u2026' }),
            jsx('td', { children: fmtBytes(f.size) }),
            jsx('td', { children: String(f.attr_count) }),
          ] }, f.process_id)),
      ] }) }),
      jsxs('div', { className: 'rt-actions', children: [
        offset > 0 && jsx('button', { onClick: () => load(Math.max(0, offset - LIMIT)), children: '\u2190 Prev' }),
        (stats && offset + LIMIT < stats.queue_size) && jsx('button', { onClick: () => load(offset + LIMIT), children: 'Next \u2192' }),
        jsxs('span', { className: 'rt-page', children: [String(offset + 1), '\u2013', String(offset + items.length)] }),
      ] }),
    ] }),
  ] });
}

// ── Main App ──
function App() {
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [graphStack, setGraphStack] = useState([{ instance_id: INSTANCE_ID, template_id: TEMPLATE_ID, conversation_id: CONVERSATION_ID, flow_ref: null }]);
  const [flowName, setFlowName] = useState('');
  const [isRunning, setIsRunning] = useState(false);
  const [error, setError] = useState('');
  const [contextMenu, setContextMenu] = useState(null);
  const [taskCatalog, setTaskCatalog] = useState([]);
  const flowRef = useRef(null);
  const layoutDone = useRef(false);
  const timerRef = useRef(null);
  const openSubflow = useCallback((ref) => {
    if (!ref || (!ref.path && !ref.inline_group_id)) return;
    let next;
    if (ref.inline_group_id) {
      const group = findGroupById(draftRef.current?.groups || {}, ref.inline_group_id);
      if (!group) return;
      next = { inline_group_id: ref.inline_group_id, flow_ref: null,
               instance_id: '', template_id: '', conversation_id: '' };
    } else {
      next = { flow_ref: ref, instance_id: '', template_id: '', conversation_id: '' };
    }
    layoutDone.current = false;
    setNodes([]);
    setEdges([]);
    setContextMenu(null);
    setGraphStack(prev => [...prev, next]);
  }, [setNodes, setEdges]);

  // Runtime operations exist only on the root graph of a RUNNING deployed
  // instance — templates and flow_ref drill-downs stay read-only.
  const [drawer, setDrawer] = useState(null);
  const rootGraph = graphStack[0] || {};
  const canOperate = graphStack.length === 1 && !!rootGraph.instance_id && isRunning;

  const onNodeContextMenu = useCallback((event, node) => {
    const ref = node?.data?.subflowRef;
    const groupId = node?.data?.inlineGroupId || (ref?.path ? node.id : '');
    const editorTask = IS_EDIT && graphStack.length === 1
      && !lockedRef.current && !node?.data?.isRuntimePort && !groupId;
    const runtimeTask = canOperate && !node?.data?.isRuntimePort;
    if (!editorTask && !runtimeTask && !groupId && !(ref && (ref.path || ref.inline_group_id))) return;
    event.preventDefault();
    setContextMenu({ x: event.clientX, y: event.clientY, ref,
                     nodeId: (editorTask || runtimeTask) ? node.id : '', groupId,
                     edit: editorTask,
                     nodeState: node?.data?.state || '' });
  }, [canOperate, graphStack.length]);

  const taskControl = useCallback((taskId, operation) => {
    setContextMenu(null);
    apiCall({ action: 'flow_runtime_task_control',
              instance_id: rootGraph.instance_id, task_id: taskId,
              operation })
      .then(d => { if (d.error) setError(d.error); else fetchDataRef.current?.(); });
  }, [rootGraph.instance_id]);

  const onEdgeClick = useCallback((event, edge) => {
    if (!canOperate || !edge?.data?.connectionId) return;
    setDrawer({ kind: 'queue', edgeData: edge.data,
                source: edge.source, target: edge.target });
  }, [canOperate]);
  const fetchDataRef = useRef(null);

  const fetchData = useCallback(async (graphOverride) => {
    let stage = 'prepare request';
    try {
      const graph = graphOverride || graphStack[graphStack.length - 1] || {};
      const body = graph.flow_ref
        ? { action: 'flow_runtime_graph', flow_ref: graph.flow_ref, _inline_response: true }
        : graph.template_id
          ? { action: 'flow_runtime_graph', template_id: graph.template_id, conversation_id: graph.conversation_id || '', _inline_response: true }
          : { action: 'flow_runtime_graph', instance_id: graph.instance_id || '', _inline_response: true };
      stage = 'fetch graph data';
      const resp = await fetch(API_BASE + '/api/ui', {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify(body),
      });
      stage = 'parse graph response';
      const data = await resp.json();
      if (data.error) { setError(data.error); return; }
      setFlowName(data.flow_name || TEMPLATE_ID || INSTANCE_ID);
      setIsRunning(data.is_running);
      setError('');

      if (!data.nodes || !data.edges) {
        const keys = data && typeof data === 'object' ? Object.keys(data).join(',') : typeof data;
        setError('Flow graph response is missing nodes or edges (keys: ' + keys + ')');
        setNodes([]);
        setEdges([]);
        return;
      }
      stage = 'normalize graph data';
      const rfNodes = toRFNodes(data.nodes, openSubflow);
      const validNodeIds = new Set(rfNodes.map(n => n.id));
      const rfEdges = toRFEdges(data.edges, validNodeIds);

      stage = 'layout graph';
      if (!layoutDone.current && rfNodes.length > 0) {
        const laid = safeLayoutGraph(rfNodes, rfEdges);
        setNodes(laid);
        layoutDone.current = true;
      } else {
        // Update in-place, keep positions
        setNodes(prev => {
          const posMap = {};
          (Array.isArray(prev) ? prev : []).forEach(n => { posMap[n.id] = n.position; });
          const newIds = rfNodes.filter(n => !posMap[n.id]);
          if (newIds.length > 0) {
            const laid = safeLayoutGraph(rfNodes, rfEdges);
            return laid.map(n => posMap[n.id] ? { ...n, position: posMap[n.id] } : n);
          }
          return rfNodes.map(n => ({ ...n, position: posMap[n.id] || { x: 0, y: 0 } }));
        });
      }
      setEdges(rfEdges);
    } catch (e) {
      setError(stage + ': ' + (e.message || e));
    }
  }, [setNodes, setEdges, graphStack, openSubflow]);

  fetchDataRef.current = fetchData;

  // ── Flow Editor state (edit mode only) ──
  // draftRef holds the canonical definition; nodes/edges are derived from it.
  const [draftMeta, setDraftMeta] = useState(null);
  const [saveState, setSaveState] = useState('idle'); // dirty|saving|saved|conflict|error|published
  const [selection, setSelection] = useState({ nodes: [], edges: [] });
  const [problems, setProblems] = useState(null);
  const [showProblems, setShowProblems] = useState(false);
  const [published, setPublished] = useState('');
  const [runtimeApplying, setRuntimeApplying] = useState(false);
  const draftRef = useRef(null);
  const revisionRef = useRef(0);
  const historyRef = useRef({ past: [], future: [] });
  const saveTimer = useRef(null);
  const lockedRef = useRef(false); // conflict or published: no further writes
  const [, bump] = useState(0);

  window._flowEditorEmbeddedServices = async (serviceType) => ({
    services: Object.entries(draftRef.current?.services || {})
      .filter(([, service]) => !serviceType || service?.type === serviceType)
      .map(([service_id, service]) => ({ service_id, scope: 'flow',
        service_type: service?.type || '', type: service?.type || '',
        provider: service?.parameters?.provider || '' })),
  });

  const projectDraft = useCallback((def) => {
    const { nodes: n, edges: e } = flowToReactFlow(def, openSubflow);
    setNodes(n);
    setEdges(e);
  }, [setNodes, setEdges, openSubflow]);

  const loadDraft = useCallback(async () => {
    const d = await apiCall({ action: 'flow_editor_load_draft', draft_id: DRAFT_ID });
    if (d.error) { setError(d.error); return; }
    draftRef.current = d.draft.definition || {};
    revisionRef.current = d.draft.revision || 0;
    historyRef.current = { past: [], future: [] };
    lockedRef.current = false;
    setDraftMeta(d.draft);
    setFlowName(d.draft.flow || '');
    setIsRunning(false);
    setError('');
    setSaveState('saved');
    projectDraft(draftRef.current);
  }, [projectDraft]);

  const saveNow = useCallback(async () => {
    if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
    if (lockedRef.current || !draftRef.current) return false;
    setSaveState('saving');
    const d = await apiCall({ action: 'flow_editor_save_draft', draft_id: DRAFT_ID,
                              definition: draftRef.current, base_revision: revisionRef.current });
    if (d.error === 'draft_changed_elsewhere') { lockedRef.current = true; setSaveState('conflict'); return false; }
    if (d.error) { setSaveState('error'); setError(d.error); return false; }
    revisionRef.current = d.revision;
    setSaveState('saved');
    return true;
  }, []);

  const scheduleSave = useCallback(() => {
    if (lockedRef.current) return;
    setSaveState('dirty');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(saveNow, AUTOSAVE_DELAY);
  }, [saveNow]);

  // One logical operation = one history entry (a drag records on drop only).
  const applyDraft = useCallback((nextDef) => {
    if (!IS_EDIT || lockedRef.current || !draftRef.current) return;
    const h = historyRef.current;
    h.past.push(draftRef.current);
    if (h.past.length > HISTORY_LIMIT) h.past.shift();
    h.future = [];
    draftRef.current = nextDef;
    projectDraft(nextDef);
    scheduleSave();
    bump(x => x + 1);
  }, [projectDraft, scheduleSave]);

  const undo = useCallback(() => {
    const h = historyRef.current;
    if (!h.past.length || lockedRef.current) return;
    h.future.push(draftRef.current);
    draftRef.current = h.past.pop();
    projectDraft(draftRef.current);
    scheduleSave();
    bump(x => x + 1);
  }, [projectDraft, scheduleSave]);

  const redo = useCallback(() => {
    const h = historyRef.current;
    if (!h.future.length || lockedRef.current) return;
    h.past.push(draftRef.current);
    draftRef.current = h.future.pop();
    projectDraft(draftRef.current);
    scheduleSave();
    bump(x => x + 1);
  }, [projectDraft, scheduleSave]);

  const onNodeDragStop = useCallback((event, node) => {
    if (!IS_EDIT || !node) return;
    applyDraft(patchLayoutNode(draftRef.current, node.id, node.position));
  }, [applyDraft]);

  const onDelete = useCallback(({ nodes: delNodes, edges: delEdges }) => {
    if (!IS_EDIT) return;
    const taskIds = (delNodes || []).map(n => n.id);
    const connIds = (delEdges || []).map(e => e?.data?.connectionId).filter(Boolean);
    if (!taskIds.length && !connIds.length) return;
    applyDraft(removeFromDraft(draftRef.current, taskIds, connIds));
  }, [applyDraft]);

  const autoLayout = useCallback(() => {
    if (!IS_EDIT) return;
    applyDraft(autoLayoutDraft(draftRef.current, nodes, edges));
  }, [applyDraft, nodes, edges]);

  const groupSelection = useCallback(() => {
    if (!IS_EDIT || lockedRef.current) return;
    const grouped = groupSelectionInDraft(
      draftRef.current, (selection.nodes || []).map(node => node.id));
    if (!grouped) { setError('Select at least one root processor to create a Process Group.'); return; }
    applyDraft(grouped.definition);
    setSelection({ nodes: [], edges: [] });
    setDrawer({ kind: 'group', groupId: grouped.groupId });
  }, [applyDraft, selection.nodes]);

  const validateDraft = useCallback(async () => {
    setShowProblems(true);
    setProblems(null);
    const d = await apiCall({ action: 'flow_editor_validate', definition: draftRef.current });
    setProblems(d.error ? { errors: 1, warnings: 0, problems: [{ severity: 'error', code: 'request_failed', message: d.error, entity_type: 'flow', entity_id: '', field: '' }] } : d);
  }, []);

  const selectEntity = useCallback((p) => {
    if (!p || !p.entity_id) return;
    setNodes(prev => prev.map(n => ({ ...n, selected: n.id === p.entity_id })));
    setEdges(prev => prev.map(e => ({ ...e, selected: e.id === p.entity_id })));
  }, [setNodes, setEdges]);

  const publishDraft = useCallback(async () => {
    if (!IS_EDIT || lockedRef.current) return;
    if (saveTimer.current && !(await saveNow())) return;
    const diff = await apiCall({ action: 'flow_editor_diff', draft_id: DRAFT_ID });
    if (diff.error) { setError(diff.error); return; }
    const base = draftMeta?.base_version || '';
    const suggested = base ? bumpPatch(base) : (draftRef.current.version || '1.0.0');
    const version = window.prompt(
      `Publish as version (${diff.count} change(s)${base ? ' vs ' + base : ''}):`, suggested);
    if (!version) return;
    const d = await apiCall({ action: 'flow_editor_publish', draft_id: DRAFT_ID,
                              version, keep_draft: !!INSTANCE_ID });
    if (d.error === 'validation_failed') { setProblems(d.validation); setShowProblems(true); return; }
    if (d.error) { setError(d.error); return; }
    lockedRef.current = true;
    setSaveState('published');
    setPublished(d.fqn);
  }, [saveNow, draftMeta]);

  // Autosave only ever writes the draft file; published versions are never
  // touched. Discarding deletes that working copy and locks the canvas.
  const discardDraft = useCallback(async () => {
    if (!IS_EDIT || lockedRef.current) return;
    if (!window.confirm('Discard this draft?\n\nPublished versions are untouched; every change made in this draft is lost.')) return;
    if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
    const d = await apiCall({ action: 'flow_editor_discard_draft', draft_id: DRAFT_ID });
    if (d.error) { setError(d.error); return; }
    lockedRef.current = true;
    setSaveState('discarded');
  }, []);

  const previewRuntimeUpdate = useCallback(async () => {
    if (!INSTANCE_ID || !published) return;
    const d = await apiCall({ action: 'flow_runtime_update_preview',
                              instance_id: INSTANCE_ID, fqn: published });
    if (d.error) { setError(d.error); return; }
    setDrawer({ kind: 'runtimeImpact', impact: d });
  }, [published]);

  const applyRuntimeUpdate = useCallback(async (impact, policies) => {
    if (!INSTANCE_ID || !published || !impact?.preview_token) return;
    setRuntimeApplying(true);
    const d = await apiCall({ action: 'flow_runtime_update_apply',
                              instance_id: INSTANCE_ID, fqn: published,
                              preview_token: impact.preview_token, ...policies });
    setRuntimeApplying(false);
    if (d.error) {
      setError(d.error);
      if (d.impact) setDrawer({ kind: 'runtimeImpact', impact: d.impact });
      return;
    }
    setDrawer(null);
    setSaveState('applied');
    setError('');
  }, [published]);

  useEffect(() => {
    if (!IS_EDIT) return undefined;
    const onKey = (ev) => {
      const tag = (ev.target && ev.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (!(ev.ctrlKey || ev.metaKey)) return;
      const k = ev.key.toLowerCase();
      if (k === 'z' && ev.shiftKey) { ev.preventDefault(); redo(); }
      else if (k === 'z') { ev.preventDefault(); undo(); }
      else if (k === 'y') { ev.preventDefault(); redo(); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [undo, redo]);

  useEffect(() => {
    if (IS_EDIT) loadDraft();
  }, [loadDraft]);

  useEffect(() => {
    if (!IS_EDIT) return;
    apiCall({ action: 'flow_editor_task_catalog' })
      .then(data => {
        if (data.error) setError(data.error);
        else setTaskCatalog(Array.isArray(data.tasks) ? data.tasks : []);
      })
      .catch(exc => setError(String(exc.message || exc)));
  }, []);

  const goBack = useCallback(() => {
    setGraphStack(prev => {
      if (prev.length <= 1) return prev;
      const nextStack = prev.slice(0, -1);
      const nextGraph = nextStack[nextStack.length - 1];
      layoutDone.current = false;
      setNodes([]);
      setEdges([]);
      return nextStack;
    });
  }, [setNodes, setEdges]);

  useEffect(() => {
    if (!contextMenu) return undefined;
    const close = () => setContextMenu(null);
    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [contextMenu]);

  useEffect(() => {
    if (IS_EDIT) {
      // A static draft: never poll. The root graph is the draft projection;
      // a subflow drill-down is fetched once, read-only.
      if (graphStack.length === 1) { if (draftRef.current) projectDraft(draftRef.current); return undefined; }
      const graph = graphStack[graphStack.length - 1] || {};
      if (graph.inline_group_id) {
        const group = findGroupById(draftRef.current?.groups || {}, graph.inline_group_id);
        if (group) { setFlowName(group.name || graph.inline_group_id); projectDraft(groupAsDefinition(group)); }
        return undefined;
      }
      fetchData();
      return undefined;
    }
    if (!INSTANCE_ID && !TEMPLATE_ID) { setError('No instance_id, template_id or draft_id parameter'); return; }
    fetchData();
    if (!TEMPLATE_ID && graphStack.length === 1) timerRef.current = setInterval(fetchData, POLL_INTERVAL);
    return () => { if (timerRef.current) clearInterval(timerRef.current); };
  }, [fetchData, graphStack.length, projectDraft]);
  // Editing happens on the root graph of a draft only; drill-downs and a
  // locked draft (conflict / published) are read-only.
  const editing = IS_EDIT && graphStack.length === 1 && !lockedRef.current;

  const onPaletteDrop = useCallback((event) => {
    if (!editing || !flowRef.current) return;
    const taskType = event.dataTransfer.getData('application/pawflow-task-type');
    if (!taskType) return;
    event.preventDefault();
    const position = flowRef.current.screenToFlowPosition({
      x: event.clientX, y: event.clientY,
    });
    const added = addTaskToDraft(draftRef.current, taskType, position);
    applyDraft(added.definition);
    setDrawer({ kind: 'editTask', taskId: added.taskId });
  }, [editing, applyDraft]);

  const onConnect = useCallback((connection) => {
    if (!editing || !connection?.source || !connection?.target) return;
    setDrawer({ kind: 'editRelation', source: connection.source,
                target: connection.target, connectionId: '' });
  }, [editing]);

  // Hide loading
  useEffect(() => {
    const el = document.getElementById('loading');
    if (el && (nodes.length > 0 || error || draftMeta)) el.style.display = 'none';
  }, [nodes, error, draftMeta]);

  const statusClass = isRunning ? 'running' : 'stopped';
  const historyState = historyRef.current;
  const saveLabel = {
    dirty: 'Unsaved changes', saving: 'Saving\u2026',
    saved: `Saved \u00B7 rev ${revisionRef.current}`, error: 'Save failed',
    conflict: 'Draft changed elsewhere', published: `Published as ${published}`,
    applied: `Applied ${published} to ${INSTANCE_ID}`,
    discarded: 'Draft discarded \u00B7 close this tab',
  }[saveState] || '';
  const editBtn = (label, onClick, opts = {}) => jsx('button', {
    id: opts.id, className: 'rt-x', title: opts.title || label, disabled: !!opts.disabled,
    style: { fontSize: 11, padding: '2px 6px', border: '1px solid #333', borderRadius: 4,
             background: opts.primary ? '#2a2f4d' : '#1a1a2e', color: opts.disabled ? '#666' : '#e0e0e0' },
    onClick, children: label,
  });

  return jsxs(Fragment, { children: [
    IS_EDIT && graphStack.length === 1 && jsx(TaskPalette, { tasks: taskCatalog }),
    jsxs('div', { id: 'statusBar', children: [
      graphStack.length > 1 && jsx('button', { id: 'backButton', onClick: goBack, children: '<=' }),
      jsx('span', { className: 'dot ' + (IS_EDIT ? 'stopped' : statusClass) }),
      jsx('span', { className: 'name', children: flowName }),
      IS_EDIT && graphStack.length === 1
        ? jsxs(Fragment, { children: [
            jsx('span', { children: `\u270E Editing draft${draftMeta?.base_version ? ' \u00B7 base ' + draftMeta.base_version : ' \u00B7 new flow'}` }),
            jsx('span', { style: { color: saveState === 'conflict' || saveState === 'error' ? '#e94560' : saveState === 'published' ? '#28a745' : '#8a93b8' },
                          children: saveLabel }),
            saveState === 'conflict' && editBtn('Reload', loadDraft, { primary: true, title: 'Another tab saved this draft: reload the latest revision (your unsaved changes are discarded)' }),
            selection.nodes.length + selection.edges.length > 0 && jsx('span', { style: { color: '#8a93b8' },
              children: `${selection.nodes.length + selection.edges.length} selected` }),
            editBtn('\u21B6 Undo', undo, { disabled: !historyState.past.length || lockedRef.current, title: 'Undo (Ctrl+Z)' }),
            editBtn('\u21B7 Redo', redo, { disabled: !historyState.future.length || lockedRef.current, title: 'Redo (Ctrl+Shift+Z)' }),
            editBtn('\u2630 Auto Layout', autoLayout, { disabled: lockedRef.current || !nodes.length }),
            editBtn('Group selection', groupSelection, { disabled: lockedRef.current || !selection.nodes.length }),
            editBtn('Add subflow', () => { setShowProblems(false); setDrawer({ kind: 'subflow', groupId: '' }); }),
            editBtn('Metadata', () => { setShowProblems(false); setDrawer({ kind: 'metadata' }); }),
            editBtn('Parameters', () => { setShowProblems(false); setDrawer({ kind: 'parameters' }); }),
            editBtn('Services', () => { setShowProblems(false); setDrawer({ kind: 'services' }); }),
            editBtn('Ports', () => { setShowProblems(false); setDrawer({ kind: 'ports' }); }),
            editBtn('${…}', () => { setShowProblems(false); setDrawer({ kind: 'expressions' }); }, { title: 'Expression helper' }),
            editBtn('\u2713 Validate', validateDraft),
            editBtn('Problems', () => problems ? setShowProblems(true) : validateDraft()),
            editBtn('\u2B06 Publish', publishDraft, { primary: true, disabled: lockedRef.current }),
            editBtn('\u{1F5D1} Discard draft', discardDraft, { disabled: lockedRef.current, title: 'Delete this draft (published versions are untouched)' }),
            INSTANCE_ID && published && editBtn('Apply to running flow', previewRuntimeUpdate, { primary: true }),
          ] })
        : jsxs(Fragment, { children: [
            jsx('span', { children: isRunning ? 'Running' : 'Stopped' }),
            // The runtime operations have no button of their own: say where
            // they live, otherwise the console reads as a plain viewer.
            canOperate && jsx('span', { style: { color: '#8a93b8' },
              children: '\u2139 Right-click a task: Start / Stop / Configuration \u00B7 click a queue to inspect, pause or empty it' }),
          ] }),
      error && jsx('span', { style: { color: '#e94560' }, children: error }),
    ] }),
    jsx(ReactFlow, {
      nodes, edges,
      nodeTypes,
      onInit: instance => { flowRef.current = instance; },
      nodesDraggable: editing,
      nodesConnectable: editing,
      elementsSelectable: true,
      onNodesChange: editing ? onNodesChange : undefined,
      onEdgesChange: editing ? onEdgesChange : undefined,
      onNodeDragStop: editing ? onNodeDragStop : undefined,
      onDelete: editing ? onDelete : undefined,
      deleteKeyCode: editing ? ['Delete', 'Backspace'] : null,
      onSelectionChange: editing ? setSelection : undefined,
      onDragOver: editing ? event => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
      } : undefined,
      onDrop: editing ? onPaletteDrop : undefined,
      onConnect: editing ? onConnect : undefined,
      onNodeContextMenu,
      onNodeDoubleClick: (event, node) => {
        const ref = node?.data?.subflowRef;
        if (ref && (ref.path || ref.inline_group_id)) openSubflow(ref);
        else if (editing) setDrawer({ kind: 'editTask', taskId: node.id });
      },
      onEdgeClick: editing ? (event, edge) => {
        event.preventDefault();
        if (edge?.data?.editable === false) { setError('Open the Process Group to inspect this boundary connection.'); return; }
        setDrawer({ kind: 'editRelation', source: edge?.data?.originalSource || edge.source,
                    target: edge?.data?.originalTarget || edge.target,
                    connectionId: edge?.data?.connectionId || edge.id });
      } : onEdgeClick,
      panOnDrag: true,
      zoomOnScroll: true,
      zoomOnPinch: true,
      panOnScroll: false,
      fitView: true,
      proOptions: { hideAttribution: true },
      style: { background: '#0a0a0a' },
      children: jsxs(Fragment, { children: [
        jsx(Background, { color: '#1a1a1a', gap: 20, size: 1 }),
        jsx(MiniMap, {
          nodeColor: n => STATE_COLORS[n.data?.state] || '#555',
          maskColor: 'rgba(0,0,0,0.7)',
          style: { background: '#141414' },
        }),
        jsx(Controls, { showInteractive: false }),
      ] }),
    }),
    contextMenu && jsxs('div', {
      className: 'graph-context-menu',
      style: { left: contextMenu.x, top: contextMenu.y },
      onClick: ev => ev.stopPropagation(),
      children: [
        contextMenu.nodeId && !contextMenu.edit && jsx('button', {
          onClick: () => taskControl(contextMenu.nodeId, 'start'),
          children: '\u25B6 Start',
        }),
        contextMenu.nodeId && !contextMenu.edit && jsx('button', {
          onClick: () => taskControl(contextMenu.nodeId, 'stop'),
          children: '\u25A0 Stop',
        }),
        contextMenu.nodeId && !contextMenu.edit && contextMenu.nodeState === 'error' && jsx('button', {
          onClick: () => taskControl(contextMenu.nodeId, 'restart'),
          children: '\u21BB Restart',
        }),
        contextMenu.nodeId && jsx('button', {
          onClick: () => {
            setDrawer({ kind: contextMenu.edit ? 'editTask' : 'task',
                        taskId: contextMenu.nodeId });
            setContextMenu(null);
          },
          children: contextMenu.edit ? '\u2699 Properties' : '\u2699 Configuration',
        }),
        contextMenu.groupId && IS_EDIT && jsx('button', {
          onClick: () => {
            setDrawer({ kind: contextMenu.ref?.path ? 'subflow' : 'group', groupId: contextMenu.groupId });
            setContextMenu(null);
          },
          children: '\u2699 Group properties',
        }),
        contextMenu.ref && (contextMenu.ref.path || contextMenu.ref.inline_group_id) && jsx('button', {
          onClick: () => openSubflow(contextMenu.ref),
          children: contextMenu.ref.path ? 'Open subflow' : 'Open Process Group',
        }),
      ],
    }),
    drawer && drawer.kind === 'task' && jsx(TaskDrawer, {
      instanceId: rootGraph.instance_id, taskId: drawer.taskId,
      onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'queue' && jsx(QueueDrawer, {
      instanceId: rootGraph.instance_id, edgeData: drawer.edgeData,
      source: drawer.source, target: drawer.target,
      onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'editTask' && jsx(TaskPropertiesDrawer, {
      taskId: drawer.taskId, definition: draftRef.current,
      onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'editRelation' && jsx(RelationPropertiesDrawer, {
      source: drawer.source, target: drawer.target,
      connectionId: drawer.connectionId, definition: draftRef.current,
      onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'metadata' && jsx(FlowMetadataDrawer, {
      definition: draftRef.current, onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'parameters' && jsx(FlowParametersDrawer, {
      definition: draftRef.current, onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'services' && jsx(FlowServicesDrawer, {
      definition: draftRef.current, onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'ports' && jsx(FlowPortsDrawer, {
      definition: draftRef.current, onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'expressions' && jsx(ExpressionHelperDrawer, {
      definition: draftRef.current, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'group' && jsx(GroupPropertiesDrawer, {
      groupId: drawer.groupId, definition: draftRef.current,
      onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'subflow' && jsx(SubflowPropertiesDrawer, {
      groupId: drawer.groupId, definition: draftRef.current,
      onApply: applyDraft, onClose: () => setDrawer(null),
    }),
    drawer && drawer.kind === 'runtimeImpact' && jsx(RuntimeImpactDrawer, {
      impact: drawer.impact, applying: runtimeApplying,
      onApply: policies => applyRuntimeUpdate(drawer.impact, policies),
      onClose: () => setDrawer(null),
    }),
    IS_EDIT && showProblems && jsx(ProblemsDrawer, {
      report: problems, onSelect: selectEntity,
      onClose: () => setShowProblems(false),
    }),
  ] });
}

createRoot(document.getElementById('root')).render(jsx(App, {}));
</script>
</body>
</html>
