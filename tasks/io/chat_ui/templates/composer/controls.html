  <button class="composer-drawer-handle pf-grip" id="composerDrawerHandle" type="button"
          aria-expanded="false" aria-controls="promptControlsPanel"
          onclick="toggleComposerDrawer()"
          title="Show/hide conversation controls" data-i18n-title="composerDrawerTitle"><span class="pf-grip-bars"></span></button>
  <div class="composer-context-row">
    <div class="prompt-controls-panel" id="promptControlsPanel">
      <div class="active-panel-title" data-i18n="conversationControls">Conversation controls</div>
      <div class="prompt-controls-row">
        <div class="permission-menu-wrap" id="permissionModeWrap" style="display:none">
          <button class="conversation-control-button" id="permissionModeBtn" type="button"
                  onclick="togglePermissionModeMenu()" aria-haspopup="menu" aria-expanded="false"
                  aria-controls="permissionModeMenu" title="Tool permission mode"
                  data-i18n-title="permissionModeTitle"><span id="permissionModeIcon" aria-hidden="true">&#x1F512;</span></button>
          <div class="permission-menu" id="permissionModeMenu" role="menu" hidden>
            <button class="permission-menu-item" type="button" role="menuitemradio" aria-checked="true"
                    data-permission-mode="default" onclick="setPermissionMode('default')"><span aria-hidden="true">&#x1F512;</span><span data-i18n="permissionDefault">Default</span></button>
            <button class="permission-menu-item" type="button" role="menuitemradio" aria-checked="false"
                    data-permission-mode="approve_edits" onclick="setPermissionMode('approve_edits')"><span aria-hidden="true">&#x270F;</span><span data-i18n="permissionApproveEdits">Approve edits</span></button>
            <button class="permission-menu-item" type="button" role="menuitemradio" aria-checked="false"
                    data-permission-mode="read_only" onclick="setPermissionMode('read_only')"><span aria-hidden="true">&#x1F4D6;</span><span data-i18n="permissionReadOnly">Read-only</span></button>
            <button class="permission-menu-item" type="button" role="menuitemradio" aria-checked="false"
                    data-permission-mode="auto" onclick="setPermissionMode('auto')"><span aria-hidden="true">&#x26A1;</span><span data-i18n="permissionAuto">Auto</span></button>
          </div>
        </div>
        <button class="btn-attach conversation-control-button" id="refreshConvBtn" onclick="refreshCurrentConversation()" title="Refresh conversation" data-i18n-title="refreshConversationTitle">&#x21BB;</button>
        <button class="conversation-quick-btn conversation-control-button" id="conversationAppearanceBtn" type="button"
                onclick="showConversationAppearanceDialog()"
                title="Conversation appearance" data-i18n-title="appearanceTitle"
                aria-label="Conversation appearance" data-i18n-aria-label="appearanceTitle">&#x1F3A8;</button>
        <button class="conversation-quick-btn conversation-control-button" id="openspaceQuickBtn" type="button"
                onclick="workspaceOpenOpenspace()"
                title="Openspace (3D)" data-i18n-title="openspaceView"
                aria-label="Openspace (3D)" data-i18n-aria-label="openspaceView">&#x1F3E2;</button>
        <button class="speak-toggle-btn conversation-control-button" id="speakToggleBtn" onclick="toggleConversationTTS()" oncontextmenu="showConversationTTSServiceDialog(); return false;" aria-label="Speak agent messages live" data-i18n-aria-label="liveSpeechStartTitle" style="display:none">&#x1F50A;</button>
        <button class="btn-attach conversation-control-button" id="voiceModeBtn" onclick="toggleVoiceMode()" oncontextmenu="showVoiceServiceDialog(); return false;" title="Start realtime voice conversation" data-i18n-title="voiceModeStartTitle" style="display:none">&#x1F399;&#xFE0F;</button>
        <div class="view-menu-wrap" id="viewMenuWrap">
          <button id="viewMenuToggle" class="tech-group-toggle conversation-control-button" type="button" aria-haspopup="true" aria-expanded="false"
                  aria-label="View options" data-i18n-aria-label="viewMenuTitle"
                  onclick="toggleViewMenu()">&#x1F441;</button>
          <div class="view-menu" id="viewMenu" role="menu">
            <div class="view-menu-section-label" data-i18n="viewMode">View mode</div>
            <div class="view-menu-item active" id="viewItemClassic" role="menuitemradio" aria-checked="true"
                 onclick="onViewModeSelect('classic')">
              <span class="view-menu-radio" aria-hidden="true"></span>
              <span class="vmi-label" data-i18n="classicView">Classic</span>
            </div>
            <div class="view-menu-item" id="viewItemSimplified" role="menuitemradio" aria-checked="false"
                 onclick="onViewModeSelect('simplified')">
              <span class="view-menu-radio" aria-hidden="true"></span>
              <span class="vmi-label" data-i18n="simplifiedView">Simplified</span>
            </div>
            <div class="view-menu-divider"></div>
            <div id="viewClassicOptions">
            <div class="view-menu-section-label" data-i18n="classicOptions">Classic options</div>
            <div class="view-menu-item" id="viewItemTechnical" role="menuitemcheckbox" aria-checked="false"
                 onclick="onViewGroupingToggle('technical')">
              <span class="vmi-label" data-i18n="viewGroupTechnical">Group technical details</span>
              <span class="vmi-switch" aria-hidden="true"></span>
            </div>
            <div class="view-menu-item" id="viewItemTask" role="menuitemcheckbox" aria-checked="false"
                 onclick="onViewGroupingToggle('task')">
              <span class="vmi-label" data-i18n="viewGroupTasks">Group task messages</span>
              <span class="vmi-switch" aria-hidden="true"></span>
            </div>
            <div class="view-menu-item" id="viewItemDelegate" role="menuitemcheckbox" aria-checked="false"
                 onclick="onViewGroupingToggle('delegate')">
              <span class="vmi-label" data-i18n="viewGroupDelegates">Group delegate messages</span>
              <span class="vmi-switch" aria-hidden="true"></span>
            </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="composer-action-mount" id="composerActionMount"></div>
  </div>
