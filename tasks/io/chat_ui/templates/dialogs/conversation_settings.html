<div class="dialog-bg" id="conversationSettingsDialog" style="display:none" onclick="if(event.target===this)closeConversationSettings()">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="conversationSettingsTitle">
    <div class="dialog-title" id="conversationSettingsTitle" data-i18n="conversationControls">Conversation controls</div>
    <div class="dialog-body">
      <label id="ttlLabel" data-i18n="ttlLabel">Expiry</label>
      <select id="ttlSelect">
        <option value="0" data-i18n="ttlNone">Unlimited</option>
        <option value="3600" data-i18n="ttl1h">1 hour</option>
        <option value="21600" data-i18n="ttl6h">6 hours</option>
        <option value="86400" data-i18n="ttl24h">24 hours</option>
        <option value="604800" data-i18n="ttl7d">7 days</option>
      </select>
      <label id="convThemeLabel" style="display:block;margin-top:12px" data-i18n="convThemeLabel">Conversation theme</label>
      <select id="conversationThemeSelect" data-conversation-theme-select
              onchange="onConversationThemeSelectChange(this.value)" aria-label="Conversation theme" data-i18n-aria-label="convThemeLabel">
        <option value="" data-i18n="useGlobalTheme">Use global theme</option>
      </select>
    </div>
    <div class="dialog-actions">
      <button class="btn" type="button" onclick="closeConversationSettings()" data-i18n="close">Close</button>
    </div>
  </div>
</div>
