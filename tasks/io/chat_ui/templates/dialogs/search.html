<div class="dialog-bg conversation-search-overlay" id="conversationSearchDialog"
     style="display:none" role="dialog" aria-modal="true"
     aria-labelledby="conversationSearchTitle">
  <div class="dialog conversation-search-dialog">
    <div class="conversation-search-head">
      <div>
        <h2 class="dialog-title" id="conversationSearchTitle"
            data-i18n="searchConversationTitle">Search conversation</h2>
        <p data-i18n="searchConversationDesc">Find text in the latest 500 messages</p>
      </div>
      <kbd>Ctrl K</kbd>
      <button class="cog-close" type="button" onclick="closeConversationSearch()"
              aria-label="Close" data-i18n-aria-label="close">&times;</button>
    </div>
    <label class="conversation-search-input-wrap" for="conversationSearchInput">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m16 16 5 5"></path>
      </svg>
      <input id="conversationSearchInput" type="search" autocomplete="off"
             placeholder="Search..." data-i18n-placeholder="searchPlaceholder"
             oninput="_conversationSearchRender()">
    </label>
    <div class="conversation-search-meta" id="conversationSearchCount" aria-live="polite"></div>
    <div class="conversation-search-results" id="conversationSearchResults"></div>
  </div>
</div>
