<!-- UI extension hosts (PFP ui.v1) -->
<div id="pf-ext-modal-host"></div>
<!-- Shared CSS tooltip portal: body-level on purpose — inside the header it
     went display:none with it, killing every tooltip while the header was
     folded. -->
<div class="pf-css-tooltip" id="pfCssTooltip" role="tooltip" aria-hidden="true"></div>
<div id="pf-ext-panel-host" style="display:none;position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--pf-panel,#16213e);border-left:1px solid var(--pf-border,#0f3460);z-index:50;overflow-y:auto;"></div>
