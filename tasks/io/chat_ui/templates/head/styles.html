<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --pf-bg: #1a1a2e;
  --pf-panel: #16213e;
  --pf-sidebar: #0f1629;
  --pf-border: #0f3460;
  --pf-text: #e0e0e0;
  --pf-muted: #6c6c8a;
  --pf-accent: #e94560;
  --pf-accent-2: #4ecdc4;
  --pf-user: #0f3460;
  --pf-assistant: #16213e;
  --pf-danger: #e94560;
  --pf-warning: #f0a500;
  --pf-success: #4ecdc4;
  --pf-code-bg: #0d1117;
  --pf-shadow: rgba(0,0,0,0.5);
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #555; }
/* dvh, not vh: on mobile browsers 100vh is the URL-bar-HIDDEN height, which is
   taller than what is actually on screen. With `overflow: hidden` the excess
   cannot be scrolled back, so the top of the layout (.header) ends up above the
   visible area and is simply unreachable. 100dvh tracks the visible viewport as
   the URL bar shows/hides. The plain 100vh line stays first as the fallback for
   engines without dvh. */
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: #1a1a2e; color: #e0e0e0; height: 100vh; height: 100dvh; display: flex; overflow: hidden; }
.sidebar { width: 260px; background: #0f1629; border-right: 1px solid #0f3460;
           display: flex; flex-direction: column; height: 100vh; height: 100dvh; flex-shrink: 0; overflow: hidden;
           transition: width 0.2s, min-width 0.2s; }
.sidebar.collapsed { width: 0; min-width: 0; border-right: none; overflow: hidden; }
.sidebar.collapsed > * { display: none; }
.sidebar-header { padding: 0 14px 12px; border-bottom: 1px solid #0f3460;
                   display: flex; align-items: center; justify-content: space-between; }
.sidebar-header h2 { font-size: 14px; color: #8888aa; font-weight: 600; }
.sidebar-header .btn-new { background: #e94560; color: white; border: none; border-radius: 6px;
                            padding: 4px 12px; cursor: pointer; font-size: 12px; font-weight: 600; }
.sidebar-header .btn-new:hover { background: #c73a52; }
.sidebar-section { flex: 0 0 auto; min-height: 0; display: flex; flex-direction: column;
                   overflow: hidden; transition: flex-grow 0.22s ease; }
.sidebar-section.active { flex: 1 1 0; }
.sidebar-section-header { flex: 0 0 auto; min-height: 42px; cursor: pointer; user-select: none; }
.sidebar-section-header:focus-visible { outline: 2px solid #e94560; outline-offset: -2px; }
.sidebar-section-body { flex: 0 0 0; min-height: 0; opacity: 0; overflow: hidden;
                        transition: flex-grow 0.22s ease, opacity 0.16s ease; }
.sidebar-section.active > .sidebar-section-body { flex: 1 1 0; opacity: 1; }
.sidebar-conversations-body { display: flex; flex-direction: column; }
.sidebar-resource-header { padding: 8px 14px; border-top: 1px solid #0f3460;
                           border-bottom: 1px solid transparent; display: flex;
                           align-items: center; gap: 5px; color: #8888aa; font-size: 11px; }
.sidebar-section.active > .sidebar-resource-header { border-bottom-color: #0f3460; }
.sidebar-section-chevron { width: 10px; flex: 0 0 10px; font-size: 10px; }
.sidebar-resources-body { padding: 8px 14px; overflow-y: auto !important;
                          scrollbar-width: thin; scrollbar-color: #333 transparent; }
.conv-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; }
.conv-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
             border: 1px solid transparent; position: relative; }
.conv-item:hover { background: #16213e; border-color: #0f3460; }
.conv-item.active { background: #16213e; border-color: #e94560; }
.conv-item .conv-preview { font-size: 13px; color: #c0c0d0; display: flex; align-items: center; overflow: hidden; }
.conv-item .conv-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.conv-item .conv-meta { font-size: 11px; color: #6c6c8a; margin-top: 3px; }
.conv-item .conv-delete { position: absolute; right: 8px; top: 8px; background: none;
                           border: none; color: #6c6c8a; cursor: pointer; font-size: 14px;
                           display: none; padding: 2px 4px; }
.conv-item:hover .conv-delete { display: block; }
.conv-item .conv-delete:hover { color: #e94560; }
.conv-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               margin-right: 6px; vertical-align: middle; }
.conv-status.active { background: #4ecdc4; animation: pulse 1.5s ease-in-out infinite; }
.conv-status.blocked { background: #f0a500; }
.conv-branch { font-size: 10px; color: #6c5ce7; margin-left: 6px; white-space: nowrap; }
/* Sharing: sidebar group headings, pending invites, shared conversations. */
.conv-group { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
              color: #6c6c8a; padding: 10px 4px 4px; display: flex;
              align-items: center; justify-content: space-between; }
.conv-group-count { color: #4a4a68; }
.conv-item.conv-invite { border-color: #6c5ce7; }
.conv-invite-actions { display: flex; gap: 6px; margin-top: 6px; }
.conv-invite-actions button { flex: 1; padding: 4px 8px; border: none; border-radius: 4px;
                             font-size: 11px; cursor: pointer; }
.conv-invite-accept { background: #6c5ce7; color: #fff; }
.conv-invite-decline { background: #2a2a4a; color: #c0c0d0; }
.conv-role-badge { font-size: 10px; margin-left: 6px; opacity: 0.7; }
.msg-author { display: inline-block; font-size: 10px; color: #6c5ce7;
              margin-right: 6px; vertical-align: baseline; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.sidebar-settings { padding: 8px 14px; border-top: 1px solid #0f3460; flex-shrink: 0; }
.sidebar-settings label { font-size: 11px; color: #6c6c8a; display: block; margin-bottom: 3px; }
.sidebar-settings select { width: 100%; background: #1a1a2e; color: #c0c0d0; border: 1px solid #0f3460;
                            border-radius: 4px; padding: 4px 6px; font-size: 12px; cursor: pointer; }
.sidebar-settings select:focus { outline: none; border-color: #e94560; }
/* Collapsible chrome grips: one visual for the three panel handles (header,
   left menu, composer drawer) — a small square showing 3 vertical lines. */
.pf-grip { display: flex; align-items: center; justify-content: center; padding: 0;
           background: var(--pf-panel, #16213e); border: 1px solid var(--pf-border, #0f3460);
           color: var(--pf-muted, #8a8fa3); cursor: pointer; }
.pf-grip { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                       background 0.15s ease, color 0.15s ease; }
.pf-grip:hover { color: var(--pf-text, #e0e0e0); background: var(--pf-user, #0f3460); }
/* Same hover zoom as the header/dock icons; each grip composes the zoom with
   its own centering translation so it stays glued to its separation line. */
.pf-grip-top:hover { transform: translateX(-50%) scale(1.4); }
.sidebar-toggle:hover { transform: translateY(-50%) scale(1.4); }
.composer-drawer-handle:hover { transform: translateX(-50%) scale(1.4); }
.pf-grip-bars { display: block; width: 12px; height: 11px;
                background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px); }
/* Vertical menu -> horizontal bars; horizontal menu -> vertical bars. */
.pf-grip-bars-h { display: block; width: 11px; height: 12px;
                  background: repeating-linear-gradient(180deg, currentColor 0 2px, transparent 2px 5px); }
.sidebar-toggle { position: fixed; top: 50%; left: 0; transform: translateY(-50%); z-index: 100;
                   width: 15px; height: 36px; border-left: none; border-radius: 0 8px 8px 0;
                   transition: left 0.2s; }
.pf-grip-top { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 210;
               width: 36px; height: 15px; border-top: none; border-radius: 0 0 8px 8px; }
/* Open state: JS moves the grip down so it rides the header's bottom line. */
#headerGrip[aria-expanded="true"] { border: 1px solid var(--pf-border, #0f3460); border-radius: 8px; }
.header.collapsed { display: none; }
.header-logo { display: flex; align-items: center; line-height: 0; font-size: 0; }
.header-logo a { display: inline-flex; align-items: center; }
.header-logo img { display: block; width: 28px; height: 28px; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.header { background: #16213e; padding: 12px 20px; border-bottom: 1px solid #0f3460;
           display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.header h1 { font-size: 18px; color: #e94560; }
.header .status { font-size: 12px; color: #6c6c8a; }
.ui-action-loading { align-items: center; gap: 7px; max-width: min(360px, 38vw); padding: 4px 9px;
                     border: 1px solid rgba(78,205,196,0.45); border-radius: 999px;
                     background: rgba(15,52,96,0.72); color: #d7fffb; font-size: 12px;
                     box-shadow: 0 0 0 1px rgba(78,205,196,0.12), 0 0 14px rgba(78,205,196,0.16);
                     white-space: nowrap; overflow: hidden; }
.ui-action-loading .ual-spinner { flex: 0 0 auto; color: #4ecdc4; animation: spin 1.1s linear infinite; }
.ui-action-loading .ual-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ui-action-loading .ual-dots::after { content: ''; animation: uiActionDots 1.2s steps(4, end) infinite; }
.ui-action-loading .ual-bar { position: relative; flex: 0 0 54px; height: 4px; border-radius: 999px;
                              background: rgba(0,0,0,0.35); overflow: hidden; }
.ui-action-loading .ual-bar::before { content: ''; position: absolute; inset: 0; width: 38%; border-radius: inherit;
                                      background: linear-gradient(90deg, #4ecdc4, #e94560);
                                      animation: uiActionSlide 1.05s ease-in-out infinite; }
@keyframes uiActionDots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }
@keyframes uiActionSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(270%); } }
.active-agent-badge { font-size: 11px; padding: 2px 10px; border-radius: 12px; cursor: pointer; margin-left: 8px; font-weight: 600; white-space: nowrap; }
.active-agent-badge:hover { filter: brightness(1.3); }
.usage-cost-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; cursor: pointer; margin-left: 6px; background: #1d3557; color: #a8dadc; white-space: nowrap; }
.usage-cost-badge:hover { filter: brightness(1.3); }
/* Header status widgets: compact icon buttons whose full content lives in a
   click-toggled popover (click shows, click again hides). */
.hdr-pop-wrap { position: relative; display: inline-flex; }
.hdr-icon-btn { position: relative; width: 28px; height: 28px; border-radius: 6px;
                border: 1px solid var(--pf-border); background: var(--pf-panel); color: var(--pf-muted);
                cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.hdr-icon-btn:hover { color: var(--pf-text); background: var(--pf-user); }
/* Same hover zoom as the dock/header icon controls. */
.hdr-icon-btn, .header-logo a { transform-origin: center bottom;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
              background 0.15s ease, border-color 0.15s ease, box-shadow 0.18s ease; }
.hdr-icon-btn:hover, .header-logo a:hover { transform: scale(1.4); z-index: 3;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); }
.hdr-icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;
                    stroke-linecap: round; stroke-linejoin: round; }
.hdr-icon-btn .hdr-action-icon { font-size: 14px; line-height: 1; }
.hdr-icon-btn.working { color: var(--pf-accent-2); border-color: var(--pf-accent-2); }
.hdr-icon-btn.working .hdr-action-icon { animation: spin 1.1s linear infinite; display: inline-block; }
.hdr-count { position: absolute; top: -5px; right: -5px; min-width: 14px; height: 14px;
             border-radius: 7px; background: var(--pf-accent); color: #fff; font-size: 9px;
             font-weight: 700; line-height: 14px; padding: 0 3px; text-align: center; }
.hdr-pop { display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 5000;
           background: var(--pf-panel); border: 1px solid var(--pf-border); border-radius: 8px;
           padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
           min-width: 230px; max-width: min(480px, 92vw); }
.hdr-pop.open { display: block; }
/* Inside its popover the active-agents box is always laid out; the popover
   itself is the only show/hide switch the reader interacts with. */
.hdr-pop .active-panel { display: block; position: static; max-width: 440px;
                         max-height: 300px; overflow-y: auto; backdrop-filter: none; }
/* Battery-style context gauge icon; the fill height mirrors the percentage. */
.ctx-gauge-icon { position: relative; width: 12px; height: 16px; border: 2px solid currentColor;
                  border-radius: 2px; display: inline-block; }
.ctx-gauge-icon::before { content: ''; position: absolute; top: -5px; left: 50%;
                          transform: translateX(-50%); width: 6px; height: 3px;
                          background: currentColor; border-radius: 1px; }
.ctx-gauge-icon-fill { position: absolute; left: 1px; right: 1px; bottom: 1px; height: 0%;
                       background: var(--pf-accent-2); border-radius: 1px; }
#ctxGaugeBtn { width: auto; padding: 0 6px; gap: 4px; }
.ctx-gauge-pct { font-size: 10px; font-variant-numeric: tabular-nums; }
.header .btn { background: #0f3460; color: #e0e0e0; border: 1px solid #e94560;
                     padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.header .btn:hover { background: #e94560; color: white; }
.header .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.header .header-auth-btn { width: 32px; height: 32px; padding: 0; display: inline-flex;
                           align-items: center; justify-content: center; font-size: 16px; line-height: 1; }
.header .header-select-control { position: relative; flex: 0 0 30px; overflow: hidden; cursor: pointer; }
.header .header-select-icon { font-size: 16px; line-height: 1; pointer-events: none; }
.header .header-icon-select { position: absolute; inset: 0; width: 100%; height: 100%;
                              opacity: 0; cursor: pointer; border: 0; padding: 0; }
.tech-group-toggle { background: var(--pf-panel); color: var(--pf-muted); border: 1px solid var(--pf-border);
                     border-radius: 6px; width: 28px; height: 28px; padding: 0; font-size: 15px;
                     cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.tech-group-toggle.active { background: var(--pf-accent); border-color: var(--pf-accent); color: var(--pf-bg); }
.tech-group-toggle:disabled { opacity: 0.6; cursor: wait; }
.view-menu-wrap { position: relative; display: none; }
.view-menu { display: none; position: absolute; left: 0; bottom: calc(100% + 4px); min-width: 220px;
             background: var(--pf-panel); border: 1px solid var(--pf-border); border-radius: 8px;
             box-shadow: 0 4px 14px rgba(0,0,0,0.4); padding: 6px 0; z-index: 5000; }
.view-menu.open { display: block; }
.view-menu.disabled { pointer-events: none; opacity: .65; }
.view-menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer;
                  font-size: 13px; color: var(--pf-text); user-select: none; }
.view-menu-item:hover { background: rgba(255,255,255,0.05); }
.view-menu-item .vmi-label { flex: 1; }
.view-menu-item .vmi-switch { width: 30px; height: 16px; border-radius: 8px; background: var(--pf-border);
                              position: relative; transition: background .15s ease; flex-shrink: 0; }
.view-menu-item .vmi-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
                                     border-radius: 50%; background: var(--pf-text); transition: left .15s ease; }
.view-menu-item.active .vmi-switch { background: var(--pf-accent); }
.view-menu-item.active .vmi-switch::after { left: 16px; }
.view-menu-item.disabled { opacity: 0.6; pointer-events: none; }
.view-menu-section-label { padding: 7px 12px 4px; color: var(--pf-muted); font-size: 10px;
                           font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.view-menu-divider { height: 1px; margin: 5px 0; background: var(--pf-border); opacity: .75; }
.view-menu-radio { width: 14px; height: 14px; border: 2px solid var(--pf-muted); border-radius: 50%;
                   position: relative; flex-shrink: 0; }
.view-menu-item.active .view-menu-radio { border-color: var(--pf-accent); }
.view-menu-item.active .view-menu-radio::after { content: ''; position: absolute; inset: 3px;
                                                  border-radius: 50%; background: var(--pf-accent); }
/* flex: none is load-bearing. .messages is a scrolling column flex container,
   so its items shrink once the transcript overflows. Every other .msg is saved
   by the automatic minimum size -- which does NOT apply to a flex item whose
   overflow is not visible. This block is the one .msg with overflow: hidden,
   so without it the header, the ephemeral cue and the tabs are squeezed to
   nothing: the block renders as a 22px bar of its own padding, leaving a two
   pixel sliver of the header as the only place a click can land.
   padding: 0 for the same reason .technical-group has none: the header, tabs
   and panels bring their own and must reach the rounded edges -- and it is
   selected as .msg.simple-turn-block because the .msg padding is declared
   further down and would otherwise win on source order. */
.msg.simple-turn-block { position: relative; margin: 8px 0; border: 1px solid var(--pf-border);
                     border-radius: 12px; background: color-mix(in srgb, var(--pf-panel) 90%, transparent);
                     overflow: hidden; flex: none; padding: 0; }
.simple-turn-header { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px;
                      padding: 8px 12px; border: 0; color: var(--pf-text); background: transparent;
                      cursor: pointer; text-align: left; }
.simple-turn-header:hover { background: color-mix(in srgb, var(--pf-border) 22%, transparent); }
.simple-turn-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.simple-turn-service { color: var(--pf-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.simple-turn-status { font-size: 11px; color: var(--pf-muted); white-space: nowrap; }
.simple-turn-status.working { color: var(--pf-accent-2); }
.simple-turn-status.completed { color: var(--pf-success); }
.simple-turn-status.error, .simple-turn-status.cancelled, .simple-turn-status.stopped { color: var(--pf-danger); }
.simple-turn-chevron { transition: transform .16s ease; }
.simple-turn-block.expanded .simple-turn-chevron { transform: rotate(90deg); }
/* The cues form a column, newest on top, on a clipped fixed-height stage that
   fades out at the bottom. Motion is transition-driven, not keyframed -- a
   cue's pose is a function of its depth, and depth changes when another cue
   arrives, which is exactly what the reader should see.
   They used to share one spot and stack in depth: readable for four words,
   unreadable the moment a cue carries a tool call rendered in full, with three
   of them blurred through each other on the same square inch. */
.simple-turn-ephemeral { position: relative; height: 190px; padding: 10px 14px 14px;
                         color: var(--pf-muted); overflow: hidden;
                         display: flex; flex-direction: column; gap: 10px;
                         /* Roller reads top to bottom, like a terminal: the
                            newest cue sits at the bottom at full strength and
                            the older ones roll up above it, fading out as they
                            go — so the fade lives at the TOP of the surface. */
                         -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 55%);
                         mask-image: linear-gradient(180deg, transparent 0%, #000 55%); }
/* The rain sits behind everything on the surface, sized by the surface itself.
   Its glyphs are drawn in the theme's accent, read off the block at run time. */
.simple-turn-rain { position: absolute; inset: 0; width: 100%; height: 100%;
                    opacity: .32; pointer-events: none; z-index: 0; }
.simple-turn-cue { position: relative; z-index: 1;
                   display: flex; align-items: flex-start; gap: 10px; flex: none;
                   max-height: 140px; overflow: hidden;
                   pointer-events: none; transform-origin: 50% 100%;
                   transition: transform .42s cubic-bezier(.22, .61, .36, 1),
                               opacity .42s ease, filter .42s ease;
                   will-change: transform, opacity, filter; }
.simple-turn-block.expanded .simple-turn-ephemeral,
.simple-turn-block:not(.turn-working) .simple-turn-ephemeral { display: none; }
/* Readable, not a ticker: a cue holds the front until the next one arrives, so
   what it shows is meant to be read, over several lines, not glimpsed. */
/* Two measured facts, not preferences. flex: 1 -- without a basis of its own
   this body computes to zero width in the row, and the text is in the DOM,
   laid out, and invisible. And no overflow/clipping *on the body*: with
   overflow: hidden it measured 442x0 with a scrollHeight of 41, on the newest
   cue only, and setting overflow: visible put it straight back to 41. The cue
   above it does the clipping instead, which measures correctly. */
.simple-turn-ephemeral-text { flex: 1; min-width: 0; text-align: left; line-height: 1.45; }
/* A tool call is shown as the classic view draws it -- the copy keeps that
   rendering and is only bounded, so a long argument list cannot outgrow the
   stage it sits on. */
.simple-turn-ephemeral-node { min-width: 0; flex: 1; overflow: hidden; max-height: 150px;
                              text-align: left; font-size: 12px;
                              -webkit-mask-image: linear-gradient(180deg, #000 76%, transparent);
                              mask-image: linear-gradient(180deg, #000 76%, transparent); }
.simple-turn-ephemeral-node .msg { margin: 0; }
.simple-turn-cue-copy { pointer-events: none; }
/* Waiting is a state, not a blank. Minutes can pass between two events, and an
   empty band under a header that says "working" reads as a stall. */
.simple-turn-idle { position: relative; z-index: 1;
                    display: flex; align-items: center; gap: 7px; pointer-events: none;
                    color: var(--pf-muted); font-size: 12px; padding: 6px 0; }
.simple-turn-idle-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pf-accent);
                        animation: simpleTurnIdle 1.25s ease-in-out infinite; }
.simple-turn-idle-dot:nth-child(2) { animation-delay: .16s; }
.simple-turn-idle-dot:nth-child(3) { animation-delay: .32s; }
.simple-turn-idle-label { opacity: .75; }
.simple-turn-elapsed { font-size: 11px; color: var(--pf-muted); white-space: nowrap;
                       font-variant-numeric: tabular-nums; }
.simple-turn-block.turn-working .simple-turn-elapsed { color: var(--pf-accent-2); }
.simple-turn-ephemeral-icons { width: 26px; height: 26px; display: grid; place-items: center;
                               flex: none; pointer-events: none; }
.simple-turn-ephemeral-icon { width: 22px; height: 22px; color: var(--pf-accent);
                              animation: simpleTurnIcon .6s ease both; }
.simple-turn-ephemeral-icon svg { width: 100%; height: 100%; display: block; }
.simple-turn-details { display: none; border-top: 1px solid var(--pf-border); }
.simple-turn-block.expanded .simple-turn-details { display: block; }
.simple-turn-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; gap: 4px; }

/* ── Mobile layout (narrow viewports) ──
   Base layout above assumes desktop width: sidebar pushes .main over at a
   fixed 260px, and .header lays every control out on one row. Neither
   holds up under ~768px: the header row has no wrap/overflow handling and
   the sidebar has no overlay mode (sidebar-toggle only shrinks it to 0
   width, it never becomes a drawer), so content gets squeezed instead of
   reflowing. This section makes both degrade gracefully instead of
   redesigning what's shown. */
@media (max-width: 768px) {
  /* One line, horizontally scrollable like the action dock — icons keep
     their size instead of shrinking into unreadability. The scrollbar is
     hidden; touch/trackpad scrolling remains. */
  .header { flex-wrap: nowrap; gap: 8px; padding: 8px 10px;
            overflow-x: auto; scrollbar-width: none; }
  .header::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .header > * { flex: 0 0 auto; }
  .header .actions { margin-left: auto; }
  /* The popovers escape the header scrollbox (overflow-x would clip them):
     fixed under the header, full width. */
  .hdr-pop { position: fixed; top: 52px; left: 8px; right: 8px; max-width: none; }
  .input-area .composer-context-row { grid-template-columns: minmax(0, 1fr); }
  .composer-context-row > .prompt-controls-panel,
  .composer-context-row > .composer-action-mount { justify-self: stretch; }
  .prompt-controls-panel { max-width: 100%; }
  /* Conversation-controls row scrolls horizontally like the header/dock. */
  .prompt-controls-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .prompt-controls-row::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .prompt-controls-row > * { flex: 0 0 auto; }
  /* The view menu escapes the row scrollbox (overflow-x would clip it):
     fixed at the bottom of the viewport, full width. */
  .view-menu { position: fixed; left: 8px; right: 8px; bottom: 8px; min-width: 0; z-index: 300; }
  /* Cognitive-panel two-pane grids stack vertically on phones. */
  .cog-split { grid-template-columns: 1fr !important; grid-template-rows: minmax(0, 38%) minmax(0, 1fr); }
  .action-dock-menu { max-width: 100%; }
  #adminSettingsMenu { left: 8px; right: 8px; transform: none; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 150;
             box-shadow: 4px 0 24px rgba(0,0,0,0.5); }
  /* The desktop dock owns a z-index of 200. Lower it only while the mobile
     drawer is open so it cannot paint over the resource menu. */
  body:has(.sidebar:not(.collapsed)) .action-dock { z-index: 140; }
  /* sidebar-toggle's left is also set inline by _syncToggleBtn() (state.js)
     to '260px' when the sidebar is open, assuming it pushes .main over.
     On mobile the sidebar overlays instead (fixed, z-index 150), so the
     toggle must stay above the drawer (z-index 200) and, while the drawer
     is open, sit just outside its right edge -- otherwise the open menu
     covers the only button that closes it and the menu cannot be closed. */
  .sidebar-toggle { left: 0 !important; z-index: 200; }
  /* The tab rail overlays too, glued to the drawer's right edge — in flow it
     would sit underneath the fixed drawer and simply disappear. The grip
     moves past both (260px drawer + ~43px rail). */
  .tab-bar { position: fixed; top: 0; bottom: 0; left: 260px; z-index: 150;
             box-shadow: 4px 0 24px rgba(0,0,0,0.5); }
  body:has(.sidebar:not(.collapsed)) .sidebar-toggle { left: 295px !important; }
  /* Desktop sizes assume a ~1400px-wide window read at arm's length; the same
     11-12px on a phone is unreadable. Bump the type scale (roughly +1-2px per
     step) and let bubbles use the full width, since horizontal space -- not
     vertical -- is what is scarce here. Sizes stay relative to each other so
     the visual hierarchy is unchanged. */
  .msg { font-size: 15px; max-width: 92%; }
  .msg code { font-size: 14px; }
  .msg pre, .msg pre code { font-size: 13px; }
  .msg.tool { font-size: 13px; max-width: 100%; }
  .msg.system { font-size: 13px; }
  .msg.system-compact { font-size: 12px; }
  .msg.agent-result { font-size: 13px; }
  .msg.error { font-size: 14px; }
  .technical-group, .delegate-block { max-width: 100%; }
  .technical-group-header, .delegate-header { font-size: 13px; }
  .tc-result, .tc-output, .tc-md code, .sub-trace-body { font-size: 12px; }
  .tc-md, .delegate-message { font-size: 13px; }
  .sub-trace-header { font-size: 13px; }
  .input-row textarea, .input-row button { font-size: 16px; }
}
