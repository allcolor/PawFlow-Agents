<!-- Tab bar -->
<div class="tab-bar collapsed" id="tabBar">
  <button class="tab-btn active" id="tabChat" data-tab="chat" title="Chat" data-i18n-title="chatTitle" onclick="switchTab('chat')">💬</button>
  <div data-pf-slot="tab_bar_ext"></div>
  <div class="tab-spacer"></div>
  <button id="audioToggleBtn" style="display:none;background:none;border:none;color:#e0e0e0;font-size:18px;cursor:pointer;padding:4px;" onclick="audioToggleMute()" title="Mute audio" data-i18n-title="muteAudioTitle">&#x1F50A;</button>
  <button id="audioRestartBtn" style="display:none;background:none;border:none;color:#e0e0e0;font-size:16px;cursor:pointer;padding:4px;" onclick="audioRestart()" title="Restart audio stream" data-i18n-title="restartAudioTitle">&#x1F504;</button>
</div>
